tasks:
  taxi_trips_daily:
    input: sample_data/taxi_trips.csv
    date_column: pickup_date
    primary_key: trip_id
    rules:
      - name: trip_id_not_null
        type: not_null
        column: trip_id
      - name: pickup_datetime_not_null
        type: not_null
        column: pickup_datetime
      - name: fare_amount_non_negative
        type: non_negative
        column: fare_amount
      - name: passenger_count_non_negative
        type: non_negative
        column: passenger_count
      - name: pickup_zone_fk_exists
        type: fk_exists
        column: pickup_zone_id
        ref_input: sample_data/taxi_zones.csv
        ref_column: zone_id
      - name: row_count_fluctuation
        type: row_count_fluctuation
        max_change_rate: 0.5
